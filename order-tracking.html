<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>arizeba. — Order Tracking</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --rose: #d98c9d;
      --rose-dark: #a85f73;
      --plum: #49313f;
      --text: #30252b;
      --muted: #8d7b82;
      --border: rgba(103,69,80,.10);
      --green: #56816a;
    }

    body {
      min-height: 100vh;
      font-family: "DM Sans", sans-serif;
      color: var(--text);

      background:
        radial-gradient(
          circle at 8% 5%,
          rgba(255,255,255,.95),
          transparent 25%
        ),
        radial-gradient(
          circle at 90% 20%,
          rgba(220,163,173,.20),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #fffaf7,
          #f7eae6 50%,
          #f1dfdd
        );

      padding-bottom: 60px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .topbar {
      max-width: 1400px;
      margin: auto;
      padding: 22px 42px;

      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .back-btn {
      width: 44px;
      height: 44px;

      border-radius: 50%;
      border: 1px solid rgba(110,70,82,.12);

      background: rgba(255,255,255,.55);
      backdrop-filter: blur(15px);

      color: var(--plum);
      font-size: 19px;

      box-shadow:
        0 8px 25px rgba(82,47,60,.06);
    }

    .brand {
      font-family: "Playfair Display", serif;
      font-size: clamp(38px, 5vw, 58px);
      font-weight: 500;
      letter-spacing: -2px;

      background:
        linear-gradient(
          135deg,
          #8e4f61,
          #d5a07f,
          #a96070,
          #e2b48d
        );

      -webkit-background-clip: text;
background-clip: text;
      -webkit-text-fill-color: transparent;

      filter:
        drop-shadow(
          0 5px 12px rgba(157,91,108,.18)
        );
    }

    .brand::after {
      content: "";

      display: inline-block;

      width: 8px;
      height: 8px;

      margin-left: 5px;
      margin-bottom: 6px;

      border-radius: 50%;

      background: #e78fa3;

      box-shadow:
        0 0 8px rgba(231,143,163,.7),
        0 0 20px rgba(231,143,163,.4);
    }

    .page {
      width: min(1100px, calc(100% - 42px));
      margin: auto;
    }

    .heading {
      margin: 20px 3px 28px;
    }

    .eyebrow {
      color: var(--rose-dark);
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .heading h1 {
      color: var(--plum);
      font-family: "Playfair Display", serif;
      font-size: clamp(42px, 5vw, 60px);
      font-weight: 500;
      line-height: 1;
    }

    .heading p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
    }

    /* TRACKING CARD */

    .tracking-card {
      padding: 28px;

      border-radius: 30px;

      background: rgba(255,255,255,.52);
      backdrop-filter: blur(20px);

      border: 1px solid rgba(255,255,255,.75);

      box-shadow:
        0 20px 55px rgba(73,42,54,.08);
    }

    .order-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      padding-bottom: 22px;
      margin-bottom: 25px;

      border-bottom: 1px solid var(--border);
    }

    .order-label {
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .order-id {
      color: var(--plum);
      font-size: 17px;
      font-weight: 700;
    }

    .status-badge {
      padding: 9px 14px;
      border-radius: 20px;

      background: #e1f0e5;
      color: var(--green);

      font-size: 10px;
      font-weight: 700;
    }

    /* TIMELINE */

    .timeline {
      position: relative;
      margin: 10px 0 30px;
    }

    .timeline::before {
      content: "";

      position: absolute;

      left: 20px;
      top: 20px;
      bottom: 20px;

      width: 2px;

      background: #eadcdf;
    }

    .timeline-item {
      position: relative;

      display: flex;
      gap: 17px;

      min-height: 85px;
    }

    .timeline-icon {
      position: relative;
      z-index: 2;

      width: 42px;
      height: 42px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #eadcdf;
      color: var(--muted);

      font-size: 16px;

      border: 4px solid #fff8f5;
    }

    .timeline-item.completed .timeline-icon {
      background: var(--rose);
      color: white;
    }

    .timeline-item.current .timeline-icon {
      background: var(--plum);
      color: white;

      box-shadow:
        0 0 0 6px rgba(73,49,63,.10);
    }

    .timeline-content {
      padding-top: 5px;
    }

    .timeline-title {
      color: var(--plum);
      font-family: "Playfair Display", serif;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .timeline-description {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.6;
    }

    .timeline-date {
      color: var(--rose-dark);
      font-size: 9px;
      font-weight: 700;
      margin-top: 5px;
    }

    /* DETAILS */

    .details {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;

      margin-top: 10px;
    }

    .detail-box {
      padding: 15px;

      border-radius: 17px;

      background: rgba(255,255,255,.55);
    }

    .detail-box span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      margin-bottom: 6px;
    }

    .detail-box strong {
      color: var(--plum);
      font-size: 11px;
      line-height: 1.5;
    }

    /* ADDRESS */

    .address-card {
      margin-top: 22px;

      padding: 20px;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.70),
          rgba(249,226,228,.55)
        );

      border:
        1px solid rgba(210,132,151,.20);
    }

    .address-heading {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 12px;
    }

    .address-icon {
      width: 36px;
      height: 36px;

      border-radius: 11px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f4dce0;

      font-size: 17px;
    }

    .address-heading strong {
      color: var(--plum);
      font-family: "Playfair Display", serif;
      font-size: 18px;
      font-weight: 500;
    }

    .address-content {
      padding-left: 46px;
    }

    .address-name {
      color: var(--plum);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .address-text {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.8;
      white-space: pre-line;
    }

    /* PRODUCTS */

    .products-card {
      margin-top: 22px;
      padding: 25px;

      border-radius: 28px;

      background: rgba(255,255,255,.52);
      backdrop-filter: blur(20px);

      border: 1px solid rgba(255,255,255,.75);

      box-shadow:
        0 20px 55px rgba(73,42,54,.06);
    }

    .products-card h2 {
      color: var(--plum);
      font-family: "Playfair Display", serif;
      font-size: 27px;
      font-weight: 500;
      margin-bottom: 15px;
    }

    .product {
      display: flex;
      align-items: center;
      gap: 14px;

      padding: 12px 0;

      border-top: 1px solid var(--border);
    }

    .product img {
      width: 70px;
      height: 75px;

      border-radius: 15px;

      object-fit: cover;

      background: #f0dfdb;
    }

    .product-info {
      flex: 1;
    }

    .product-name {
      color: var(--plum);
      font-family: "Playfair Display", serif;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .product-meta {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.7;
    }

    .product-price {
      color: var(--plum);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* ACTIONS */

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .action-btn {
      flex: 1;
      min-height: 48px;
      border-radius: 15px;
      font-size: 11px;
      font-weight: 700;
    }

    .orders-btn {
      border: 1px solid rgba(73,49,63,.15);
      background: rgba(255,255,255,.65);
      color: var(--plum);
    }

    .shop-btn {
      border: none;

      background:
        linear-gradient(
          135deg,
          #49313f,
          #795465
        );

      color: white;
    }

    .refresh-btn {
      border: 1px solid rgba(73,49,63,.15);
      background: rgba(255,255,255,.65);
      color: var(--plum);
    }

    /* LOADING / ERROR */

    .loading,
    .error {
      text-align: center;
      padding: 70px 20px;

      border-radius: 28px;

      background: rgba(255,255,255,.50);

      color: var(--muted);
      font-size: 12px;
    }

    .error {
      color: var(--rose-dark);
    }

    .empty {
      text-align: center;
      padding: 75px 20px;

      border-radius: 28px;

      background: rgba(255,255,255,.50);
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .empty h2 {
      color: var(--plum);
      font-family: "Playfair Display", serif;
      font-size: 30px;
      font-weight: 500;
    }

    .empty p {
      color: var(--muted);
      font-size: 12px;
      margin: 8px 0 20px;
    }

    /* MOBILE */

    @media (max-width: 850px) {

      .details {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 700px) {

      .topbar {
        padding: 18px 15px;
      }

      .brand {
        font-size: 36px;
      }

      .back-btn {
        width: 38px;
        height: 38px;
      }

      .page {
        width: calc(100% - 20px);
      }

      .tracking-card,
      .products-card {
        padding: 20px;
        border-radius: 23px;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .order-top {
        align-items: flex-start;
      }

      .product img {
        width: 60px;
        height: 65px;
      }

      .product-name {
        font-size: 15px;
      }

      .actions {
        flex-direction: column;
      }

      .address-content {
        padding-left: 0;
      }

    }

  </style>

</head>

<body>

<header class="topbar">

  <button
    class="back-btn"
    onclick="goBack()"
  >
    ←
  </button>

  <div class="brand">
    arizeba
  </div>

  <div></div>

</header>


<main class="page">

  <section class="heading">

    <div class="eyebrow">
      Stay Updated
    </div>

    <h1>
      Track Your Order
    </h1>

    <p>
      Follow your order from confirmation to delivery.
    </p>

  </section>


  <div id="trackingContainer">

    <div class="loading">
      Loading order...
    </div>

  </div>

</main>


<script>

  /* =====================================================
     BACKEND
  ===================================================== */

  const API_URL =
    "http://localhost:5000";


  /* =====================================================
     LOAD ORDER ID
  ===================================================== */

  function getOrderId() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const urlOrderId =
      params.get("orderId");


    if (urlOrderId) {

      return urlOrderId;

    }


    const lastOrder =
      JSON.parse(
        localStorage.getItem(
          "arizebaLastOrder"
        )
      );


    if (
      lastOrder &&
      lastOrder.orderId
    ) {

      return lastOrder.orderId;

    }


    return null;

  }


  /* =====================================================
     LOAD TRACKING FROM BACKEND
  ===================================================== */

  async function loadTracking() {

    const container =
      document.getElementById(
        "trackingContainer"
      );


    const orderId =
      getOrderId();


    if (!orderId) {

      showEmpty();

      return;

    }


    container.innerHTML = `
      <div class="loading">
        <div style="font-size:30px;margin-bottom:12px;">
          📦
        </div>
        Loading your order details...
      </div>
    `;


    try {

      const response =
        await fetch(
          `${API_URL}/api/orders/${encodeURIComponent(orderId)}`
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.message ||
          "Order not found"
        );

      }


      const order =
        data.order;


      if (!order) {

        throw new Error(
          "Order information was not returned."
        );

      }


      renderTracking(order);


    } catch (error) {

      console.error(
        "Tracking error:",
        error
      );


      container.innerHTML = `

        <section class="error">

          <div style="font-size:40px;margin-bottom:15px;">
            ⚠️
          </div>

          <strong>
            Could not load order
          </strong>

          <p style="margin-top:8px;">
            ${escapeHTML(error.message || "Please try again.")}
          </p>

          <button
            class="action-btn refresh-btn"
            style="margin-top:18px;padding:0 20px;"
            onclick="loadTracking()"
          >
            ↻ Try Again
          </button>

        </section>

      `;

    }

  }


  /* =====================================================
     RENDER TRACKING
  ===================================================== */

  function renderTracking(order) {

    const container =
      document.getElementById(
        "trackingContainer"
      );


    const deliveryType =
      order.delivery_type === "express"
        ? "Express Delivery"
        : "Standard Delivery";


    const paymentNames = {

      cod:
        "Cash on Delivery",

      card:
        "Debit / Credit Card",

      jazzcash:
        "JazzCash",

      easypaisa:
        "Easypaisa"

    };


    const payment =
      paymentNames[
        order.payment_method
      ] ||
      order.payment_method ||
      "Cash on Delivery";


    /* =================================================
       ITEMS
    ================================================= */

    let items = [];


    try {

      if (
        Array.isArray(order.items)
      ) {

        items =
          order.items;

      } else {

        items =
          JSON.parse(
            order.items || "[]"
          );

      }

    } catch (error) {

      console.error(
        "Items parsing error:",
        error
      );

      items = [];

    }


    /* =================================================
       PRODUCTS
    ================================================= */

    let subtotal = 0;

    let productsHTML = "";


    items.forEach(product => {

      const quantity =
        Number(
          product.quantity || 1
        );


      const unitPrice =
        Number(
          product.price || 0
        );


      const price =
        unitPrice * quantity;


      subtotal += price;


      productsHTML += `

        <div class="product">

          <img
            src="${escapeHTML(product.image || "")}"
            alt="${escapeHTML(product.name || "Product")}"
            onerror="this.style.display='none'"
          >

          <div class="product-info">

            <div class="product-name">
              ${escapeHTML(
                product.name || "Product"
              )}
            </div>

            <div class="product-meta">

              Quantity: ${quantity}

              ${
                product.color
                  ? "<br>Color: " +
                    escapeHTML(product.color)
                  : ""
              }

              ${
                product.version
                  ? "<br>Variant: " +
                    escapeHTML(product.version)
                  : ""
              }

            </div>

          </div>

          <div class="product-price">
            PKR ${price.toLocaleString()}
          </div>

        </div>

      `;

    });


    /* =================================================
       DELIVERY / TOTAL
    ================================================= */

    const delivery =
      Number(
        order.delivery_price ||
        order.delivery?.price ||
        0
      );


    const total =
      Number(
        order.total ||
        subtotal + delivery
      );


    const currentStatus =
      order.status ||
      "Order Placed";


    /* =================================================
       ADDRESS
    ================================================= */

    const customerName =
      order.customer_name ||
      order.customerName ||
      "Guest Customer";


    const customerPhone =
      order.customer_phone ||
      order.customerPhone ||
      "Not provided";


    const customerEmail =
      order.customer_email ||
      order.customerEmail ||
      "";


    const address =
      order.address ||
      "Delivery address not available";


    let addressExtra = "";

    if (customerEmail) {

      addressExtra =
        `<br>Email: ${escapeHTML(customerEmail)}`;

    }


    /* =================================================
       RENDER PAGE
    ================================================= */

    container.innerHTML = `

      <section class="tracking-card">

        <div class="order-top">

          <div>

            <div class="order-label">
              Order ID
            </div>

            <div class="order-id">
              ${escapeHTML(
                order.order_id ||
                order.orderId ||
                "Unknown"
              )}
            </div>

          </div>

          <div class="status-badge">
            ${escapeHTML(
              currentStatus
            )}
          </div>

        </div>


        ${buildTimeline(currentStatus)}


        <div class="details">

          <div class="detail-box">

            <span>
              Delivery Method
            </span>

            <strong>
              ${deliveryType}
            </strong>

          </div>


          <div class="detail-box">

            <span>
              Payment Method
            </span>

            <strong>
              ${escapeHTML(payment)}
            </strong>

          </div>


          <div class="detail-box">

            <span>
              Order Total
            </span>

            <strong>
              PKR ${total.toLocaleString()}
            </strong>

          </div>


          <div class="detail-box">

            <span>
              Customer
            </span>

            <strong>
              ${escapeHTML(customerName)}
            </strong>

          </div>

        </div>


        <!-- DELIVERY ADDRESS -->

        <div class="address-card">

          <div class="address-heading">

            <div class="address-icon">
              📍
            </div>

            <strong>
              Delivery Address
            </strong>

          </div>

          <div class="address-content">

            <div class="address-name">
              ${escapeHTML(customerName)}
            </div>

            <div class="address-text">
${escapeHTML(address)}
<br>Phone: ${escapeHTML(customerPhone)}
${addressExtra}
            </div>

          </div>

        </div>


      </section>


      <!-- PRODUCTS -->

      <section class="products-card">

        <h2>
          Order Items
        </h2>

        ${
          productsHTML ||
          '<p style="color:#8d7b82;font-size:11px;">No product details available.</p>'
        }


        <div class="actions">

          <button
            class="action-btn orders-btn"
            onclick="goToOrders()"
          >
            ← My Orders
          </button>


          <button
            class="action-btn refresh-btn"
            onclick="loadTracking()"
          >
            ↻ Refresh Tracking
          </button>


          <button
            class="action-btn shop-btn"
            onclick="continueShopping()"
          >
            Continue Shopping →
          </button>

        </div>

      </section>

    `;

  }


  /* =====================================================
     TIMELINE
  ===================================================== */

  function buildTimeline(status) {

    const steps = [

      {
        name: "Order Placed",
        description:
          "Your order has been successfully placed."
      },

      {
        name: "Confirmed",
        description:
          "Your order has been received and confirmed."
      },

      {
        name: "Processing",
        description:
          "Your order is being prepared by the seller."
      },

      {
        name: "Shipped",
        description:
          "Your package has been handed over to the courier."
      },

      {
        name: "Out for Delivery",
        description:
          "Your package is on its way to your address."
      },

      {
        name: "Delivered",
        description:
          "Your order has been delivered successfully."
      }

    ];


    let currentIndex =
      steps.findIndex(
        step =>
          step.name === status
      );


    if (currentIndex < 0) {

      currentIndex = 0;

    }


    let html = `

      <div class="timeline">

    `;


    steps.forEach(
      (step, index) => {

        let className = "";


        if (
          index <
          currentIndex
        ) {

          className =
            "completed";

        } else if (
          index ===
          currentIndex
        ) {

          className =
            "current";

        }


        const icon =
          index <
          currentIndex
            ? "✓"
            : index === currentIndex
              ? "●"
              : String(index + 1);


        html += `

          <div
            class="timeline-item ${className}"
          >

            <div class="timeline-icon">
              ${icon}
            </div>


            <div class="timeline-content">

              <div class="timeline-title">
                ${step.name}
              </div>

              <div class="timeline-description">
                ${step.description}
              </div>

              ${
                index === currentIndex
                  ? `
                    <div class="timeline-date">
                      Current Status
                    </div>
                  `
                  : index < currentIndex
                    ? `
                      <div class="timeline-date">
                        Completed
                      </div>
                    `
                    : ""
              }

            </div>

          </div>

        `;

      }
    );


    html += `

      </div>

    `;


    return html;

  }


  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHTML(value) {

    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =====================================================
     EMPTY
  ===================================================== */

  function showEmpty() {

    const container =
      document.getElementById(
        "trackingContainer"
      );


    container.innerHTML = `

      <section class="empty">

        <div class="empty-icon">
          📦
        </div>

        <h2>
          No order found
        </h2>

        <p>
          Place an order first to track it here.
        </p>

        <button
          class="action-btn shop-btn"
          style="padding:0 25px;"
          onclick="continueShopping()"
        >
          Start Shopping →
        </button>

      </section>

    `;

  }
