<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AriZeba. — Products</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --rose: #d98c9d;
      --rose-dark: #a85f73;
      --plum: #49313f;
      --text: #30252b;
      --muted: #8d7b82;
      --border: rgba(103, 69, 80, 0.10);
      --green: #56816a;
    }

    body {
      min-height: 100vh;

      color: var(--text);

      font-family: "DM Sans", sans-serif;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(255,255,255,.95),
          transparent 25%
        ),
        radial-gradient(
          circle at 90% 20%,
          rgba(220,163,173,.20),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #fffaf7 0%,
          #f6e9e5 50%,
          #f1dfdd 100%
        );

      overflow-x: hidden;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }


    /* ================= HEADER ================= */

    .topbar {
      max-width: 1500px;

      margin: auto;

      padding: 24px 42px 12px;

      display: grid;

      grid-template-columns:
        1fr
        auto
        1fr;

      align-items: center;
    }

    .left-actions,
    .right-actions {
      display: flex;

      align-items: center;

      gap: 12px;
    }

    .right-actions {
      justify-content: flex-end;
    }


    .icon-btn {
      width: 44px;
      height: 44px;

      border-radius: 50%;

      border:
        1px solid
        rgba(110,70,82,.12);

      background:
        rgba(255,255,255,.50);

      backdrop-filter: blur(15px);

      color: var(--plum);

      font-size: 19px;

      box-shadow:
        0 8px 25px
        rgba(82,47,60,.06);

      transition: .2s ease;
    }

    .icon-btn:hover {
      transform: translateY(-2px);

      background:
        rgba(255,255,255,.80);
    }


    /* ================= BRAND ================= */

    .brand {
      font-family:
        "Playfair Display",
        serif;

      font-size:
        clamp(38px, 5vw, 60px);

      font-weight: 500;

      letter-spacing: -2px;

      background:
        linear-gradient(
          135deg,
          #8e4f61,
          #d5a07f,
          #a96070,
          #e2b48d
        );

      -webkit-background-clip: text;

      background-clip: text;

      -webkit-text-fill-color: transparent;

      filter:
        drop-shadow(
          0 5px 12px
          rgba(157,91,108,.18)
        );

      white-space: nowrap;
    }


    /* ================= PAGE ================= */

    .page {
      width:
        min(
          1450px,
          calc(100% - 42px)
        );

      margin: auto;

      padding-bottom: 50px;
    }


    /* ================= SEARCH ================= */

    .search-wrapper {
      max-width: 900px;

      margin:
        18px auto 30px;
    }

    .search-box {
      height: 58px;

      display: flex;

      align-items: center;

      gap: 13px;

      padding: 0 20px;

      border-radius: 30px;

      border:
        1px solid
        rgba(111,76,87,.12);

      background:
        rgba(255,255,255,.62);

      backdrop-filter: blur(20px);

      box-shadow:
        0 12px 35px
        rgba(91,54,68,.07),

        inset 0 1px 0
        rgba(255,255,255,.8);

      transition: .2s ease;
    }

    .search-box:focus-within {
      transform: translateY(-2px);

      box-shadow:
        0 18px 45px
        rgba(91,54,68,.12),

        0 0 0 3px
        rgba(217,140,157,.10);
    }

    .search-icon {
      color: var(--rose-dark);

      font-size: 21px;
    }

    .search-box input {
      flex: 1;

      border: none;

      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 15px;
    }

    .search-box input::placeholder {
      color: #9c898f;
    }


    /* ================= TITLE ================= */

    .heading-area {
      display: flex;

      align-items: flex-end;

      justify-content: space-between;

      margin:
        20px 4px 24px;
    }

    .eyebrow {
      color: var(--rose-dark);

      text-transform: uppercase;

      letter-spacing: 4px;

      font-size: 10px;

      font-weight: 700;

      margin-bottom: 8px;
    }

    .heading-area h1 {
      font-family:
        "Playfair Display",
        serif;

      color: var(--plum);

      font-size:
        clamp(34px, 4vw, 52px);

      font-weight: 500;

      line-height: 1;
    }

    .heading-area p {
      margin-top: 9px;

      color: var(--muted);

      font-size: 13px;
    }

    .back-btn {
      border: none;

      background: transparent;

      color: var(--rose-dark);

      font-weight: 600;

      font-size: 13px;
    }


    /* ================= FILTER ================= */

    .filter-bar {
      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 12px 15px;

      margin-bottom: 22px;

      border:
        1px solid
        var(--border);

      border-radius: 18px;

      background:
        rgba(255,255,255,.50);

      backdrop-filter: blur(18px);

      box-shadow:
        0 10px 28px
        rgba(73,42,54,.05);
    }

    .filter-left {
      display: flex;

      gap: 9px;

      flex-wrap: wrap;
    }

    .filter-btn,
    .sort-select {
      border:
        1px solid
        rgba(111,76,87,.10);

      border-radius: 22px;

      background:
        rgba(255,255,255,.72);

      padding: 10px 15px;

      color: var(--plum);

      font-size: 12px;

      font-weight: 600;
    }

    .filter-btn.active {
      background: var(--plum);

      color: white;
    }

    .sort-select {
      outline: none;
    }


    /* ================= PRODUCTS ================= */

    .products {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;
    }

    .product {
      position: relative;

      background:
        rgba(255,255,255,.66);

      border:
        1px solid
        rgba(112,74,86,.08);

      border-radius: 24px;

      padding: 10px;

      box-shadow:
        0 13px 30px
        rgba(73,42,54,.06);

      transition: .28s ease;

      cursor: pointer;
    }

    .product:hover {
      transform: translateY(-7px);

      box-shadow:
        0 22px 45px
        rgba(73,42,54,.13);
    }

    .product-image {
      height: 290px;

      position: relative;

      overflow: hidden;

      border-radius: 18px;

      background: #f2e3df;
    }

    .product-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transition: .45s ease;
    }

    .product:hover
    .product-image img {
      transform: scale(1.05);
    }


    .discount {
      position: absolute;

      top: 11px;
      left: 11px;

      z-index: 2;

      padding: 6px 10px;

      border-radius: 13px;

      background: #c96d85;

      color: white;

      font-size: 10px;

      font-weight: 700;
    }


    .heart {
      position: absolute;

      right: 11px;
      top: 11px;

      z-index: 5;

      width: 36px;
      height: 36px;

      border: none;

      border-radius: 50%;

      background:
        rgba(255,255,255,.86);

      color: #76505d;

      font-size: 18px;

      backdrop-filter: blur(10px);
    }


    .product-info {
      padding:
        13px 5px 7px;
    }

    .product-name {
      color: var(--text);

      font-size: 14px;

      font-weight: 600;

      line-height: 1.35;

      margin-bottom: 7px;
    }

    .rating {
      color: #bd8740;

      font-size: 12px;

      margin-bottom: 8px;
    }

    .rating-count {
      color: var(--muted);

      font-size: 10px;
    }

    .price {
      color: var(--plum);

      font-size: 16px;

      font-weight: 700;
    }

    .old-price {
      color: #aa989d;

      font-size: 11px;

      font-weight: 400;

      margin-left: 5px;

      text-decoration: line-through;
    }

    .stock {
      margin-top: 7px;

      color: var(--green);

      font-size: 10px;

      font-weight: 600;
    }

    .stock.out {
      color: #a85f73;
    }

    .add-btn {
      width: 100%;

      margin-top: 12px;

      padding: 11px;

      border: none;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #b96f82,
          #d99aa5
        );

      color: white;

      font-size: 12px;

      font-weight: 700;

      box-shadow:
        0 8px 20px
        rgba(185,111,130,.18);

      transition: .2s ease;
    }

    .add-btn:hover {
      transform: translateY(-2px);
    }

    .add-btn:disabled {
      cursor: not-allowed;

      opacity: .55;

      transform: none;
    }


    /* ================= STATES ================= */

    .loading {
      grid-column: 1 / -1;

      text-align: center;

      padding: 80px 20px;

      color: var(--muted);

      font-size: 13px;
    }

    .loading-icon {
      font-size: 35px;

      margin-bottom: 12px;
    }

    .empty {
      display: none;

      text-align: center;

      padding: 70px 20px;

      color: var(--muted);
    }

    .empty h2 {
      font-family:
        "Playfair Display",
        serif;

      color: var(--plum);

      font-size: 30px;

      margin-bottom: 8px;
    }

    .empty p {
      font-size: 12px;
    }

    .error-state {
      grid-column: 1 / -1;

      text-align: center;

      padding: 70px 20px;

      color: var(--rose-dark);
    }

    .error-state h2 {
      color: var(--plum);

      font-family:
        "Playfair Display",
        serif;

      font-size: 28px;

      margin-bottom: 8px;
    }

    .retry-btn {
      margin-top: 18px;

      border: none;

      border-radius: 14px;

      padding: 12px 22px;

      background: var(--plum);

      color: white;

      font-size: 11px;

      font-weight: 700;
    }


    /* ================= CART BADGE ================= */

    .cart-wrapper {
      position: relative;

      display: inline-block;
    }

    .cart-badge {
      position: absolute;

      top: -5px;
      right: -5px;

      min-width: 19px;

      height: 19px;

      padding: 0 5px;

      display: none;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      background: #c96d85;

      color: white;

      font-size: 9px;

      font-weight: 700;

      border:
        2px solid
        #fff8f5;
    }


    /* ================= BOTTOM NAV ================= */

    .bottom-nav {
      position: sticky;

      bottom: 12px;

      z-index: 50;

      width:
        min(
          700px,
          calc(100% - 30px)
        );

      margin:
        40px auto 0;

      padding: 10px;

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      background:
        rgba(255,255,255,.74);

      backdrop-filter: blur(25px);

      border:
        1px solid
        rgba(255,255,255,.85);

      border-radius: 25px;

      box-shadow:
        0 15px 45px
        rgba(66,40,51,.15);
    }

    .nav-item {
      border: none;

      background: transparent;

      min-height: 55px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 4px;

      color: #725b64;

      font-size: 11px;
    }

    .nav-item span:first-child {
      font-size: 19px;
    }

    .nav-item.active {
      color: #b85e79;

      font-weight: 700;
    }


    /* ================= RESPONSIVE ================= */

    @media (max-width: 1100px) {

      .products {
        grid-template-columns:
          repeat(3, 1fr);
      }

    }


    @media (max-width: 800px) {

      .products {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .product-image {
        height: 250px;
      }

    }


    @media (max-width: 600px) {

      .topbar {
        padding:
          18px 15px 8px;
      }

      .brand {
        font-size: 36px;
      }

      .icon-btn {
        width: 38px;
        height: 38px;
      }

      .page {
        width:
          calc(100% - 22px);
      }

      .heading-area {
        align-items: flex-start;

        flex-direction: column;

        gap: 15px;
      }

      .filter-bar {
        align-items: flex-start;

        flex-direction: column;

        gap: 12px;
      }

      .filter-left {
        width: 100%;

        overflow-x: auto;

        flex-wrap: nowrap;

        padding-bottom: 3px;
      }

      .sort-select {
        width: 100%;
      }

      .products {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 10px;
      }

      .product {
        padding: 7px;

        border-radius: 17px;
      }

      .product-image {
        height: 205px;

        border-radius: 13px;
      }

      .product-info {
        padding:
          9px 3px 4px;
      }

      .product-name {
        font-size: 12px;
      }

      .price {
        font-size: 14px;
      }

      .add-btn {
        padding: 9px;

        font-size: 11px;
      }

      .bottom-nav {
        width:
          calc(100% - 20px);
      }

    }


    @media (max-width: 400px) {

      .brand {
        font-size: 31px;
      }

      .product-image {
        height: 175px;
      }

      .heart {
        width: 32px;
        height: 32px;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header class="topbar">


    <div class="left-actions">

      <button
        class="icon-btn"
        onclick="goBack()"
        aria-label="Go Back"
      >
        ←
      </button>

    </div>


    <!-- BRAND -->

    <div class="brand">
      AriZeba.
    </div>


    <div class="right-actions">

      <div class="cart-wrapper">

        <button
          class="icon-btn"
          onclick="openCart()"
          aria-label="Open Cart"
        >
          🛍
        </button>

        <span
          class="cart-badge"
          id="cartBadge"
        >
          0
        </span>

      </div>

    </div>

  </header>


  <main class="page">


    <!-- SEARCH -->

    <div class="search-wrapper">

      <div class="search-box">

        <span class="search-icon">
          ⌕
        </span>

        <input
          id="searchInput"
          type="text"
          placeholder="Search in products..."
          oninput="handleSearch()"
        >

      </div>

    </div>


    <!-- TITLE -->

    <section class="heading-area">

      <div>

        <div class="eyebrow">
          Curated collection
        </div>

        <h1 id="categoryTitle">
          All Products
        </h1>

        <p id="productCount">
          Loading products...
        </p>

      </div>


      <button
        class="back-btn"
        onclick="goBack()"
      >
        ← Back
      </button>

    </section>


    <!-- FILTERS -->

    <section class="filter-bar">

      <div
        class="filter-left"
        id="categoryFilters"
      >

        <button
          class="filter-btn active"
          data-category="all"
          onclick="setCategory('all', this)"
        >
          All
        </button>

      </div>


      <select
        class="sort-select"
        id="sortSelect"
        onchange="applyFilters()"
      >

        <option value="recommended">
          Sort: Recommended
        </option>

        <option value="low">
          Price: Low → High
        </option>

        <option value="high">
          Price: High → Low
        </option>

        <option value="rating">
          Customer Rating
        </option>

        <option value="newest">
          Newest
        </option>

      </select>

    </section>


    <!-- PRODUCTS -->

    <section
      class="products"
      id="productsGrid"
    >

      <div class="loading">

        <div class="loading-icon">
          🛍
        </div>

        Loading products...

      </div>

    </section>


    <!-- EMPTY -->

    <section
      class="empty"
      id="emptyState"
    >

      <h2>
        No products found
      </h2>

      <p>
        Try another category or search.
      </p>

    </section>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">


      <button
        class="nav-item"
        onclick="goHome()"
      >

        <span>⌂</span>

        <span>Home</span>

      </button>


      <button
        class="nav-item"
        onclick="openCategories()"
      >

        <span>▦</span>

        <span>Categories</span>

      </button>


      <button
        class="nav-item active"
        onclick="focusSearch()"
      >

        <span>⌕</span>

        <span>Search</span>

      </button>


      <button
        class="nav-item"
        onclick="openCart()"
      >

        <span>🛒</span>

        <span>Cart</span>

      </button>


      <button
        class="nav-item"
        onclick="openAccount()"
      >

        <span>♙</span>

        <span>Account</span>

      </button>

    </nav>

  </main>


  <script>


    /* =====================================================
       BACKEND
    ===================================================== */

    const API_URL =
      "http://localhost:5000";


    /* =====================================================
       STATE
    ===================================================== */

    let allProducts = [];

    let selectedCategory = "all";

    let searchValue = "";


    /* =====================================================
       SELECTED CATEGORY
    ===================================================== */

    function loadSelectedCategory() {

      const savedCategory =
        localStorage.getItem(
          "arizebaSelectedCategory"
        );

      if (!savedCategory) {
        return;
      }

      selectedCategory =
        savedCategory;

      const title =
        document.getElementById(
          "categoryTitle"
        );

      if (title) {

        title.textContent =
          formatCategory(
            savedCategory
          );

      }

    }


    /* =====================================================
       CART
    ===================================================== */

    function getCart() {

      try {

        const saved =
          localStorage.getItem(
            "arizebaCart"
          );

        if (!saved) {
          return [];
        }

        const parsed =
          JSON.parse(saved);

        return Array.isArray(parsed)
          ? parsed
          : [];

      } catch (error) {

        console.error(
          "Cart loading error:",
          error
        );

        return [];

      }

    }


    function saveCart(cart) {

      localStorage.setItem(
        "arizebaCart",
        JSON.stringify(cart)
      );

    }


    /* =====================================================
       CART BADGE
    ===================================================== */

    function updateCartBadge() {

      const cart =
        getCart();

      const totalQuantity =
        cart.reduce(
          (sum, product) =>
            sum +
            Number(
              product.quantity || 1
            ),
          0
        );

      const badge =
        document.getElementById(
          "cartBadge"
        );

      if (!badge) {
        return;
      }

      badge.textContent =
        totalQuantity;

      badge.style.display =
        totalQuantity > 0
          ? "flex"
          : "none";

    }


    /* =====================================================
       LOAD PRODUCTS
    ===================================================== */

    async function loadProducts() {

      const grid =
        document.getElementById(
          "productsGrid"
        );

      grid.innerHTML = `
        <div class="loading">

          <div class="loading-icon">
            🛍
          </div>

          Loading products...

        </div>
      `;

      try {

        const response =
          await fetch(
            `${API_URL}/api/products`
          );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.message ||
            "Failed to load products"
          );

        }

        allProducts =
          Array.isArray(
            data.products
          )
            ? data.products
            : [];

        createCategoryButtons();

        applyFilters();

      } catch (error) {

        console.error(
          "Products loading error:",
          error
        );

        grid.innerHTML = `

          <div class="error-state">

            <div
              style="
                font-size:40px;
                margin-bottom:12px;
              "
            >
              ⚠️
            </div>

            <h2>
              Could Not Load Products
            </h2>

            <p>
              Please make sure the
              AriZeba server is running
              on port 5000.
            </p>

            <button
              class="retry-btn"
              onclick="loadProducts()"
            >
              Try Again
            </button>

          </div>

        `;

      }

    }


    /* =====================================================
       CATEGORY BUTTONS
    ===================================================== */

    function createCategoryButtons() {

      const container =
        document.getElementById(
          "categoryFilters"
        );

      const categories =
        [
          ...new Set(
            allProducts
              .map(
                product =>
                  String(
                    product.category || ""
                  ).trim()
              )
              .filter(Boolean)
          )
        ].sort();

      container.innerHTML = "";


      const allButton =
        document.createElement(
          "button"
        );

      allButton.className =
        "filter-btn";

      allButton.dataset.category =
        "all";

      allButton.textContent =
        "All";

      allButton.onclick =
        function() {

          setCategory(
            "all",
            this
          );

        };

      container.appendChild(
        allButton
      );


      categories.forEach(
        category => {

          const button =
            document.createElement(
              "button"
            );

          button.className =
            "filter-btn";

          button.dataset.category =
            category;

          button.textContent =
            formatCategory(
              category
            );

          button.onclick =
            function() {

              setCategory(
                category,
                this
              );

            };

          container.appendChild(
            button
          );

        }
      );


      updateActiveCategoryButton();

    }


    /* =====================================================
       FORMAT CATEGORY
    ===================================================== */

    function formatCategory(value) {

      return String(value)
        .replace(
          /[-_]/g,
          " "
        )
        .replace(
          /\b\w/g,
          char =>
            char.toUpperCase()
        );

    }


    /* =====================================================
       ACTIVE CATEGORY
    ===================================================== */

    function updateActiveCategoryButton() {

      document
        .querySelectorAll(
          ".filter-btn"
        )
        .forEach(
          button => {

            const category =
              button.dataset.category;

            if (
              String(category).toLowerCase() ===
              String(selectedCategory).toLowerCase()
            ) {

              button.classList.add(
                "active"
              );

            } else {

              button.classList.remove(
                "active"
              );

            }

          }
        );

    }


    /* =====================================================
       CATEGORY
    ===================================================== */

    function setCategory(
      category,
      button
    ) {

      selectedCategory =
        category;


      if (
        category === "all"
      ) {

        document.getElementById(
          "categoryTitle"
        ).textContent =
          "All Products";

        localStorage.removeItem(
          "arizebaSelectedCategory"
        );

      } else {

        document.getElementById(
          "categoryTitle"
        ).textContent =
          formatCategory(
            category
          );

        localStorage.setItem(
          "arizebaSelectedCategory",
          category
        );

      }


      updateActiveCategoryButton();

      applyFilters();

    }


    /* =====================================================
       SEARCH
    ===================================================== */

    function handleSearch() {

      searchValue =
        document
          .getElementById(
            "searchInput"
          )
          .value
          .trim()
          .toLowerCase();

      applyFilters();

    }


    function focusSearch() {

      const input =
        document.getElementById(
          "searchInput"
        );

      if (input) {

        input.focus();

      }

      window.scrollTo({

        top: 0,

        behavior: "smooth"

      });

    }


    /* =====================================================
       APPLY FILTERS
    ===================================================== */

    function applyFilters() {

      let products =
        [...allProducts];


      if (
        selectedCategory !==
        "all"
      ) {

        products =
          products.filter(
            product => {

              const productCategory =
                String(
                  product.category || ""
                )
                .trim()
                .toLowerCase();

              const selected =
                String(
                  selectedCategory
                )
                .trim()
                .toLowerCase();

              return (
                productCategory ===
                selected
              );

            }
          );

      }


      if (searchValue) {

        products =
          products.filter(
            product => {

              const name =
                String(
                  product.name || ""
                ).toLowerCase();

              const description =
                String(
                  product.description || ""
                ).toLowerCase();

              const category =
                String(
                  product.category || ""
                ).toLowerCase();

              return (
                name.includes(
                  searchValue
                ) ||
                description.includes(
                  searchValue
                ) ||
                category.includes(
                  searchValue
                )
              );

            }
          );

      }


      const sort =
        document.getElementById(
          "sortSelect"
        ).value;


      if (sort === "low") {

        products.sort(
          (a, b) =>
            Number(a.price || 0) -
            Number(b.price || 0)
        );

      }


      if (sort === "high") {

        products.sort(
          (a, b) =>
            Number(b.price || 0) -
            Number(a.price || 0)
        );

      }


      if (sort === "rating") {

        products.sort(
          (a, b) =>
            Number(b.rating || 0) -
            Number(a.rating || 0)
        );

      }


      if (sort === "newest") {

        products.sort(
          (a, b) =>
            new Date(
              b.created_at || 0
            ) -
            new Date(
              a.created_at || 0
            )
        );

      }


      renderProducts(
        products
      );

    }


    /* =====================================================
       RENDER PRODUCTS
    ===================================================== */

    function renderProducts(
      products
    ) {

      const grid =
        document.getElementById(
          "productsGrid"
        );

      const empty =
        document.getElementById(
          "emptyState"
        );

      const count =
        document.getElementById(
          "productCount"
        );

      grid.innerHTML = "";


      count.textContent =
        products.length +
        (
          products.length === 1
            ? " product available"
            : " products available"
        );


      if (
        products.length === 0
      ) {

        empty.style.display =
          "block";

        return;

      }


      empty.style.display =
        "none";


      products.forEach(
        product => {

          grid.appendChild(
            createProductCard(
              product
            )
          );

        }
      );


      restoreWishlistUI();

    }


    /* =====================================================
       PRODUCT CARD
    ===================================================== */

    function createProductCard(
      product
    ) {

      const article =
        document.createElement(
          "article"
        );

      article.className =
        "product";


      const productId =
        product.product_id ||
        product.id ||
        "";


      const name =
        product.name ||
        "Product";


      const price =
        Number(
          product.price || 0
        );


      const oldPrice =
        Number(
          product.old_price || 0
        );


      const rating =
        Number(
          product.rating || 0
        );


      const stock =
        Number(
          product.stock || 0
        );


      const image =
        product.image ||
        "https://via.placeholder.com/700x800?text=AriZeba";


      const discount =
        oldPrice > price &&
        oldPrice > 0

          ? Math.round(
              (
                (
                  oldPrice -
                  price
                ) /
                oldPrice
              ) * 100
            )

          : 0;


      const ratingCount =
        Number(
          product.review_count ||
          0
        );


      /* PRODUCT CLICK */

      article.addEventListener(
        "click",
        function(event) {

          if (
            event.target.closest(
              ".heart"
            )
          ) {

            return;

          }


          if (
            event.target.closest(
              ".add-btn"
            )
          ) {

            return;

          }


          openProductDetails(
            product
          );

        }
      );


      article.innerHTML = `

        <div class="product-image">

          ${
            discount > 0

              ? `
                <span class="discount">
                  -${discount}%
                </span>
              `

              : ""
          }


          <button
            class="heart"
            type="button"
            aria-label="Add to wishlist"
            data-product-id="${escapeHTML(productId)}"
          >
            ♡
          </button>


          <img
            src="${escapeHTML(image)}"
            alt="${escapeHTML(name)}"
            loading="lazy"
          >

        </div>


        <div class="product-info">

          <div class="product-name">
            ${escapeHTML(name)}
          </div>


          <div class="rating">

            ★
            ${rating.toFixed(1)}

            ${
              ratingCount > 0

                ? `
                  <span class="rating-count">
                    (${ratingCount})
                  </span>
                `

                : ""
            }

          </div>


          <div class="price">

            PKR
            ${price.toLocaleString()}

            ${
              oldPrice > price

                ? `
                  <span class="old-price">
                    PKR
                    ${oldPrice.toLocaleString()}
                  </span>
                `

                : ""
            }

          </div>


          ${
            stock > 0

              ? `
                <div class="stock">
                  ${stock} available
                </div>
              `

              : `
                <div class="stock out">
                  Out of stock
                </div>
              `
          }


          <button
            class="add-btn"
            type="button"
            ${stock <= 0 ? "disabled" : ""}
            data-product-id="${escapeHTML(productId)}"
          >

            ${
              stock > 0
                ? "Add to Cart"
                : "Out of Stock"
            }

          </button>

        </div>

      `;


      const heart =
        article.querySelector(
          ".heart"
        );


      if (heart) {

        heart.addEventListener(
          "click",
          function(event) {

            event.stopPropagation();

            toggleWishlist(
              this
            );

          }
        );

      }


      const addButton =
        article.querySelector(
          ".add-btn"
        );


      if (
        addButton &&
        stock > 0
      ) {

        addButton.addEventListener(
          "click",
          function(event) {

            event.stopPropagation();

            addProductToCart(
              this,
              productId
            );

          }
        );

      }


      return article;

    }


    /* =====================================================
       OPEN PRODUCT DETAILS
    ===================================================== */

    function openProductDetails(
      product
    ) {

      if (!product) {

        alert(
          "Product could not be loaded."
        );

        return;

      }


      const productId =
        product.product_id ||
        product.id;


      if (!productId) {

        alert(
          "Product ID is missing."
        );

        return;

      }


      localStorage.setItem(
        "arizebaSelectedProduct",
        JSON.stringify(
          product
        )
      );


      window.location.href =
        "product-details.html?id=" +
        encodeURIComponent(
          productId
        );

    }


    /* =====================================================
       ADD TO CART
    ===================================================== */

    function addProductToCart(
      button,
      productId
    ) {

      const product =
        allProducts.find(
          item =>
            String(
              item.product_id ||
              item.id
            ) ===
            String(productId)
        );


      if (!product) {

        alert(
          "Product could not be found."
        );

        return;

      }


      const stock =
        Number(
          product.stock || 0
        );


      if (stock <= 0) {

        alert(
          "This product is currently out of stock."
        );

        return;

      }


      let cart =
        getCart();


      const existingIndex =
        cart.findIndex(
          item =>
            String(item.id) ===
            String(productId)
        );


      if (
        existingIndex !== -1
      ) {

        const currentQuantity =
          Number(
            cart[existingIndex]
              .quantity || 1
          );


        if (
          currentQuantity >= stock
        ) {

          alert(
            `Only ${stock} item(s) available in stock.`
          );

          return;

        }


        cart[existingIndex]
          .quantity =
          currentQuantity + 1;

      } else {

        cart.push({

          id:
            productId,

          name:
            product.name ||
            "Product",

          price:
            Number(
              product.price || 0
            ),

          image:
            product.image || "",

          category:
            product.category || "",

          quantity:
            1,

          stock:
            stock

        });

      }


      saveCart(cart);

      updateCartBadge();


      const oldText =
        button.textContent;


      button.textContent =
        "Added ✓";


      button.style.background =
        "linear-gradient(135deg, #49313f, #795465)";


      setTimeout(
        () => {

          button.textContent =
            oldText;

          button.style.background =
            "linear-gradient(135deg, #b96f82, #d99aa5)";

        },
        1200
      );

    }


    /* =====================================================
       WISHLIST
    ===================================================== */

    function getWishlist() {

      try {

        const saved =
          localStorage.getItem(
            "arizebaWishlist"
          );

        if (!saved) {
          return [];
        }

        const parsed =
          JSON.parse(saved);

        return Array.isArray(parsed)
          ? parsed
          : [];

      } catch (error) {

        return [];

      }

    }


    function saveWishlist(
      wishlist
    ) {

      localStorage.setItem(
        "arizebaWishlist",
        JSON.stringify(
          wishlist
        )
      );

    }


    function toggleWishlist(
      button
    ) {

      const productId =
        button.dataset.productId;


      let wishlist =
        getWishlist();


      const index =
        wishlist.findIndex(
          id =>
            String(id) ===
            String(productId)
        );


      if (index === -1) {

        wishlist.push(
          productId
        );

        button.textContent =
          "♥";

        button.style.color =
          "#d56d87";

      } else {

        wishlist.splice(
          index,
          1
        );

        button.textContent =
          "♡";

        button.style.color =
          "#76505d";

      }


      saveWishlist(
        wishlist
      );

    }


    function restoreWishlistUI() {

      const wishlist =
        getWishlist();


      document
        .querySelectorAll(
          ".heart"
        )
        .forEach(
          button => {

            const id =
              button.dataset.productId;


            if (
              wishlist.some(
                item =>
                  String(item) ===
                  String(id)
              )
            ) {

              button.textContent =
                "♥";

              button.style.color =
                "#d56d87";

            }

          }
        );

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(
      value
    ) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }
        /* =====================================================
       NAVIGATION
    ===================================================== */

    function goBack() {

      if (
        document.referrer &&
        document.referrer.includes(
          window.location.hostname
        )
      ) {

        window.history.back();

      } else {

        window.location.href =
          "index.html";

      }

    }


    function goHome() {

      window.location.href =
        "index.html";

    }


    function openCategories() {

      window.location.href =
        "categories.html";

    }


    function openCart() {

      window.location.href =
        "cart.html";

    }


    function openAccount() {

      window.location.href =
        "account.html";

    }


    /* =====================================================
       INITIALIZE
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        loadSelectedCategory();

        updateCartBadge();

        loadProducts();

      }
    );


  </script>
